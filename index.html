<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3b1d">
  <title>チャイ レジ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-box" id="loginForm">
      <div class="login-title">☕ チャイ レジ</div>
      <label>合言葉
        <input type="password" id="loginPass" autocomplete="current-password" autofocus>
      </label>
      <div class="login-err" id="loginErr"></div>
      <button class="btn primary" type="submit">ログイン</button>
    </form>
  </div>

  <header class="topbar">
    <div class="brand">☕ チャイ レジ</div>
    <div class="reg-name" id="regName"></div>
    <div class="sync" id="syncStatus" title="同期状態">…</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="register">レジ</button>
    <button class="tab" data-view="history">履歴</button>
    <button class="tab" data-view="summary">集計</button>
    <button class="tab" data-view="settings">設定</button>
  </nav>

  <!-- レジ -->
  <main class="view active" id="view-register">
    <section class="menu-grid" id="menuGrid"></section>

    <section class="checkout">
      <div class="cart" id="cart"></div>

      <div class="total-row">
        <span>合計</span>
        <span class="total" id="total">¥0</span>
      </div>

      <div class="actions">
        <button class="btn ghost" id="clearCart">取消</button>
        <button class="btn primary" id="confirm">記録する</button>
      </div>
    </section>
  </main>

  <!-- 履歴 -->
  <main class="view" id="view-history">
    <div class="toolbar">
      <select id="historyDate"></select>
      <label class="check"><input type="checkbox" id="historyMine"> この端末のみ</label>
    </div>
    <ul class="history" id="historyList"></ul>
  </main>

  <!-- 集計 -->
  <main class="view" id="view-summary">
    <div class="toolbar">
      <select id="summaryDate"></select>
      <button class="btn small" id="exportCsv">CSV書き出し</button>
    </div>
    <div class="cards" id="summaryCards"></div>
    <h3>日別</h3>
    <table class="table" id="dayTable"></table>
    <h3>商品別</h3>
    <table class="table" id="itemTable"></table>
    <h3>時間帯別</h3>
    <table class="table" id="hourTable"></table>
    <h3>レジ別</h3>
    <table class="table" id="registerTable"></table>
  </main>

  <!-- 設定 -->
  <main class="view" id="view-settings">
    <section class="panel">
      <h3>接続</h3>
      <label>Apps Script ウェブアプリURL
        <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </label>
      <label>この端末のレジ名
        <input type="text" id="cfgRegister" placeholder="レジ1">
      </label>
      <label class="check"><input type="checkbox" id="cfgSound"> 記録時の効果音を鳴らす</label>
      <div class="row">
        <button class="btn primary small" id="saveConfig">保存</button>
        <button class="btn small" id="testConn">接続テスト</button>
        <button class="btn small" id="reload">再読み込み</button>
        <button class="btn small danger" id="logout">ログアウト</button>
      </div>
      <p class="note" id="connMsg">URL未設定の間は、この端末内だけに保存する「ローカルモード」で動きます。</p>
    </section>

    <section class="panel">
      <h3>メニュー</h3>
      <div id="menuEditor"></div>
      <div class="row">
        <button class="btn small" id="addMenu">＋ 商品を追加</button>
        <button class="btn primary small" id="saveMenu">メニューを保存</button>
      </div>
      <p class="note">左から 商品名・価格・杯数（セットなら4）・色。保存するとスプレッドシートの「メニュー」シートにも反映され、他のレジにも共有されます。</p>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="pop" id="pop" aria-live="polite"></div>

  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
